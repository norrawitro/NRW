<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก — NRW</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#EEF1F8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.10);padding:40px 36px;width:100%;max-width:460px}
    .logo{text-align:center;margin-bottom:24px}
    .logo h1{font-size:1.6rem;color:#4F46E5;font-weight:700}
    .logo p{color:#6b7280;font-size:.9rem;margin-top:4px}
    .form-group{margin-bottom:18px}
    label{display:block;font-size:.85rem;font-weight:600;color:#374151;margin-bottom:6px}
    input{width:100%;padding:10px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:.95rem;transition:border .2s;outline:none;background:#f9fafb}
    input:focus{border-color:#4F46E5;background:#fff}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .btn{width:100%;padding:12px;background:#4F46E5;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:8px;transition:background .2s}
    .btn:hover{background:#4338ca}
    .error{background:#fef2f2;border:1px solid #fca5a5;color:#dc2626;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:.9rem}
    .hint{font-size:.78rem;color:#9ca3af;margin-top:4px}
    .footer{text-align:center;margin-top:20px;font-size:.88rem;color:#6b7280}
    .footer a{color:#4F46E5;text-decoration:none;font-weight:600}
    .footer a:hover{text-decoration:underline}
    .required{color:#ef4444}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>🌐 NRW</h1>
      <p>สมัครสมาชิกใหม่</p>
    </div>

    {% if error %}
    <div class="error">⚠️ {{ error }}</div>
    {% endif %}

    <form method="post" action="/members/register" autocomplete="off">
      <div class="form-group">
        <label>ชื่อ-นามสกุล <span class="required">*</span></label>
        <input type="text" name="full_name" value="{{ values.get('full_name','') }}"
               placeholder="เช่น Norrawit Roopsoong" required maxlength="100">
      </div>

      <div class="row">
        <div class="form-group">
          <label>Username <span class="required">*</span></label>
          <input type="text" name="username" value="{{ values.get('username','') }}"
                 placeholder="อย่างน้อย 3 ตัวอักษร" required minlength="3" maxlength="50"
                 pattern="[a-zA-Z0-9_]+" title="ตัวอักษร ตัวเลข หรือ _">
          <div class="hint">ตัวอักษร/ตัวเลข/_</div>
        </div>
        <div class="form-group">
          <label>เบอร์โทรศัพท์</label>
          <input type="tel" name="phone" value="{{ values.get('phone','') }}"
                 placeholder="0812345678" maxlength="20">
        </div>
      </div>

      <div class="form-group">
        <label>Email <span class="required">*</span></label>
        <input type="email" name="email" value="{{ values.get('email','') }}"
               placeholder="example@email.com" required maxlength="100">
      </div>

      <div class="row">
        <div class="form-group">
          <label>รหัสผ่าน <span class="required">*</span></label>
          <input type="password" name="password" placeholder="อย่างน้อย 8 ตัว"
                 required minlength="8">
        </div>
        <div class="form-group">
          <label>ยืนยันรหัสผ่าน <span class="required">*</span></label>
          <input type="password" name="confirm" placeholder="พิมพ์ซ้ำ" required>
        </div>
      </div>

      <button type="submit" class="btn">✅ สมัครสมาชิก</button>
    </form>

    <div class="footer">
      มีบัญชีแล้ว? <a href="/members/login">เข้าสู่ระบบ</a>
    </div>
  </div>
</body>
</html>
