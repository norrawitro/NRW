<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ — NRW</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#EEF1F8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.10);padding:40px 36px;width:100%;max-width:400px}
    .logo{text-align:center;margin-bottom:28px}
    .logo h1{font-size:1.6rem;color:#4F46E5;font-weight:700}
    .logo p{color:#6b7280;font-size:.9rem;margin-top:4px}
    .form-group{margin-bottom:18px}
    label{display:block;font-size:.85rem;font-weight:600;color:#374151;margin-bottom:6px}
    input{width:100%;padding:10px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:.95rem;transition:border .2s;outline:none;background:#f9fafb}
    input:focus{border-color:#4F46E5;background:#fff}
    .btn{width:100%;padding:12px;background:#4F46E5;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:8px;transition:background .2s}
    .btn:hover{background:#4338ca}
    .error{background:#fef2f2;border:1px solid #fca5a5;color:#dc2626;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:.9rem}
    .footer{text-align:center;margin-top:20px;font-size:.88rem;color:#6b7280}
    .footer a{color:#4F46E5;text-decoration:none;font-weight:600}
    .footer a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>🌐 NRW</h1>
      <p>เข้าสู่ระบบ</p>
    </div>

    {% if error %}
    <div class="error">⚠️ {{ error }}</div>
    {% endif %}

    <form method="post" action="/members/login">
      <div class="form-group">
        <label>Username หรือ Email</label>
        <input type="text" name="username" placeholder="username หรือ email" required autofocus>
      </div>
      <div class="form-group">
        <label>รหัสผ่าน</label>
        <input type="password" name="password" placeholder="รหัสผ่าน" required>
      </div>
      <button type="submit" class="btn">🔐 เข้าสู่ระบบ</button>
    </form>

    <div class="footer">
      ยังไม่มีบัญชี? <a href="/members/register">สมัครสมาชิก</a>
    </div>
  </div>
</body>
</html>
